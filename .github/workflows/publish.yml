---
name: Publish

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guard: a vX.Y.Z tag must match packages/geto-graph's version.
      # Manual dispatch (workflow_dispatch) skips this check.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(
            node -p 'require("./packages/geto-graph/package.json").version'
          )"
          if [ "$expected" != "$actual" ]; then
            msg="::error::tag v${expected} does not match package version"
            echo "$msg ${actual}"
            exit 1
          fi

      - name: Smoke test (index and query this repo)
        run: node packages/geto-graph/test.mjs .

      - name: Publish geto-graph to npm
        working-directory: packages/geto-graph
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
