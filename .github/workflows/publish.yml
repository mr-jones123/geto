---
name: Publish

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Guard: a vX.Y.Z tag must match ALL packages' version.
      # Manual dispatch (workflow_dispatch) skips this check.
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for pkg in geto-graph geto-subagents geto-goals; do
            actual="$(
              node -p "require('./packages/${pkg}/package.json').version"
            )"
            if [ "$expected" != "$actual" ]; then
              echo "::error::tag v${expected} does not match ${pkg} version " \
                "${actual}"
              exit 1
            fi
          done

      - name: Smoke test (index and query this repo)
        run: node packages/geto-graph/test.mjs .

      - name: Publish geto-graph to npm
        working-directory: packages/geto-graph
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish geto-subagents to npm
        working-directory: packages/geto-subagents
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish geto-goals to npm
        working-directory: packages/geto-goals
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
