---
name: Publish geto-graph

"on":
  workflow_call:
    inputs:
      ref:
        description: Git commit created by Release Please
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run geto-graph regression tests
        run: npm test

      - name: Skip if version already published
        id: check-published
        working-directory: packages/geto-graph
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view geto-graph@"$VER" version >/dev/null 2>&1; then
            echo "geto-graph@$VER already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish geto-graph to npm
        if: steps.check-published.outputs.skip != 'true'
        working-directory: packages/geto-graph
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
