---
name: Publish geto-goals

"on":
  workflow_call:
    inputs:
      ref:
        description: Git commit created by Release Please
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify package contents
        working-directory: packages/geto-goals
        run: npm pack --dry-run

      - name: Publish geto-goals to npm
        working-directory: packages/geto-goals
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
